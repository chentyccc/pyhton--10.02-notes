<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>返回 Python 课堂笔记</title></head>
<body><p>正在返回课堂笔记… <a id="notes" href="index.html">打开笔记</a></p>
<script>
(() => {
  const target = new URL('index.html', window.location.href);
  target.search = window.location.search;
  target.hash = window.location.hash;
  document.getElementById('notes').href = target.href;
  window.location.replace(target.href);
})();
</script></body></html>
